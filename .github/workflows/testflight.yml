# Builds the Mac App Store version of Kairos and uploads it to App Store Connect.
# The build shows up in TestFlight once Apple finishes processing it (usually 5 to 30 min).
# To ship it on the App Store, pick that build in App Store Connect and submit it for review.
#
# The App Store build differs from the DMG build (release.yml) in a few ways, all set in
# src-tauri/tauri.appstore.conf.json: its own bundle id, App Sandbox, and no macOSPrivateApi
# (Apple rejects private API use), so the Focus widget window is not transparent there.
#
# Repository secrets:
#   MAS_APP_CERT_P12             base64 .p12 of the Mac App Distribution identity
#                                ("3rd Party Mac Developer Application"), signs the .app
#   MAS_INSTALLER_CERT_P12       base64 .p12 of the Mac Installer Distribution identity
#                                ("3rd Party Mac Developer Installer"), signs the .pkg
#   MAS_CERTIFICATES_PASSWORD    password of both .p12 files
#   MAS_PROVISIONING_PROFILE     base64 "Mac App Store Connect" provisioning profile for
#                                com.abdellahibrahim.kairos
#   APPLE_TEAM_ID                10-character team id
#   APP_STORE_CONNECT_KEY_ID     App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID  App Store Connect API issuer id
#   APP_STORE_CONNECT_PRIVATE_KEY  contents of the AuthKey_<id>.p8 file
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KEYCHAIN: ${{ runner.temp }}/appstore.keychain-db
      APP_PATH: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Kairos.app
      PKG_PATH: ${{ runner.temp }}/Kairos.pkg

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Import signing certificates
        env:
          APP_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
        run: |
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"

          for p12 in "$APP_P12" "$INSTALLER_P12"; do
            echo "$p12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v "$KEYCHAIN")"
          app_identity="$(grep -oE '"(Apple Distribution|3rd Party Mac Developer Application): [^"]+"' <<< "$identities" | head -1 | tr -d '"')"
          installer_identity="$(grep -oE '"3rd Party Mac Developer Installer: [^"]+"' <<< "$identities" | head -1 | tr -d '"')"
          if [[ -z "$app_identity" || -z "$installer_identity" ]]; then
            echo "Expected a Mac App Distribution and a Mac Installer Distribution identity. Found:" >&2
            echo "$identities" >&2
            exit 1
          fi
          echo "APP_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"

      - name: Prepare App Store config
        env:
          PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > src-tauri/embedded.provisionprofile
          sed -i '' "s/__TEAM_ID__/$TEAM_ID/g" src-tauri/Entitlements.appstore.plist
          # Every upload needs a higher CFBundleVersion; the run number always grows.
          jq --arg v "$GITHUB_RUN_NUMBER" '.bundle.macOS.bundleVersion = $v' \
            src-tauri/tauri.appstore.conf.json > "$RUNNER_TEMP/appstore.json"
          mv "$RUNNER_TEMP/appstore.json" src-tauri/tauri.appstore.conf.json
          echo "Kairos $(jq -r .version src-tauri/tauri.conf.json) build $GITHUB_RUN_NUMBER"

      - name: Build signed app
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APP_IDENTITY }}
        run: pnpm tauri build --bundles app --target aarch64-apple-darwin --config src-tauri/tauri.appstore.conf.json

      - name: Package installer
        run: xcrun productbuild --sign "$INSTALLER_IDENTITY" --component "$APP_PATH" /Applications "$PKG_PATH"

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type macos --file "$PKG_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf ~/.appstoreconnect src-tauri/embedded.provisionprofile
